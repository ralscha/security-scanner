name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: security-scanner-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ralscha/security-scanner'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected release source and version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" ]]; then
            echo 'Releases must run from a Git tag.' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Release tags must be valid semantic versions such as v1.2.3 or v1.2.3-rc.1.' >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          core_and_prerelease="${version%%+*}"
          if [[ "$core_and_prerelease" == *-* ]]; then
            prerelease="${core_and_prerelease#*-}"
            IFS='.' read -r -a identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != 0 && "$identifier" == 0* ]]; then
                echo 'Numeric prerelease identifiers must not contain leading zeroes.' >&2
                exit 1
              fi
            done
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo 'Release tags must identify a commit on the protected main branch.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" != "$GITHUB_SHA" ]]; then
            echo 'The release tag must resolve to the workflow commit.' >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Run lint
        run: docker run --rm -v "$PWD:/app" -w /app golangci/golangci-lint:v2.13.1@sha256:6ffe652d2215f590fcf6c6edcda8959c7a765a09378c200d31e098f7516f16c9 golangci-lint run --timeout 10m

  release:
    if: github.repository == 'ralscha/security-scanner'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Revalidate immutable release tag
        shell: bash
        run: |
          set -euo pipefail

          remote_refs="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")"
          direct="$(awk -v ref="refs/tags/$GITHUB_REF_NAME" '$2 == ref { print $1 }' <<< "$remote_refs")"
          peeled="$(awk -v ref="refs/tags/$GITHUB_REF_NAME^{}" '$2 == ref { print $1 }' <<< "$remote_refs")"
          remote_commit="${peeled:-$direct}"
          if [[ ! "$remote_commit" =~ ^[0-9a-f]{40}$ || "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo 'The protected release tag no longer identifies the verified commit.' >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo 'The verified release commit is no longer on main.' >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest released archives from checksums
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/checksums.txt
